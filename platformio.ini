; PlatformIO project configuration for school-attendance edge device
; Hybrid architecture: ESP32 (R307 fingerprint) + Firebase Cloud Functions

[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Partition table — default.csv has OTA (ota_0 + ota_1) + 1MB storage.
; Outdoor deployment needs remote firmware updates without physical access.
board_build.partitions = default.csv

; Upload speed
upload_speed = 921600

; Compiler flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DCONFIG_LOG_DEFAULT_LEVEL_NONE=0

build_unflags =
    -std=gnu++11

; Libraries (pinned to known-good versions)
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.0.7
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/RTClib@^2.1.4
    tzapu/WiFiManager@^0.16.0
    bblanchon/ArduinoJson@^7.0.4
    paulstoffregen/Time@^1.6.1
    nimaltd/NTPClient@^4.1.0
    ; ArduinoOTA built-in (no dep needed)

; Filesystem: LittleFS for offline log queue (faster + wear-levelled vs SD)
board_build.filesystem = littlefs

; Exclude secrets.h from git
build_src_filter = +<*> -<.git/> -<secrets.h>
